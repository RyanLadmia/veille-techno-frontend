<app-header />

<main>
  <section class="bg-gray-50">
    <div class="mx-auto max-w-6xl px-6 py-24 text-center">

      <h1 class="text-5xl font-bold tracking-tight text-gray-900">
        Organisez vos projets simplement
      </h1>

      <p class="mx-auto mt-6 max-w-2xl text-lg text-gray-600">
        Une application Kanban simple pour organiser vos tâches,
        suivre votre progression et travailler efficacement.
      </p>

      <!-- Message provenant du backend -->
      <p class="mt-6">
        {{ message() }}
      </p>

      <div class="mt-8">
        <app-button
          label="Commencer"
          (clicked)="start()"
        />
      </div>

    </div>
  </section>

  <section class="mx-auto max-w-6xl px-6 py-20">
    <h2 class="mb-10 text-center text-3xl font-bold text-gray-900">
      Fonctionnalités
    </h2>

    <div class="grid gap-6 md:grid-cols-3">
      @for (feature of features; track feature.title) {
        <app-feature-card
          [title]="feature.title"
          [description]="feature.description"
        />
      }
    </div>
  </section>
</main>
